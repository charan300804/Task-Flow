services:
  postgres:
    image: postgres:16-alpine
    container_name: taskflow-postgres
    restart: always
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow_password
      POSTGRES_DB: taskflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: taskflow-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: taskflow-minio
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  createbuckets:
    image: minio/mc:latest
    container_name: taskflow-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadminpassword;
      /usr/bin/mc mb --ignore-existing myminio/taskflow-artifacts;
      /usr/bin/mc anonymous set download myminio/taskflow-artifacts;
      exit 0;
      "

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: taskflow-backend:latest
    container_name: taskflow-backend
    restart: always
    environment:
      PROJECT_NAME: "TaskFlow"
      ENVIRONMENT: "production"
      POSTGRES_SERVER: "postgres"
      POSTGRES_PORT: 5432
      POSTGRES_USER: "taskflow"
      POSTGRES_PASSWORD: "taskflow_password"
      POSTGRES_DB: "taskflow_db"
      REDIS_HOST: "redis"
      REDIS_PORT: 6379
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minioadminpassword"
      MINIO_BUCKET_NAME: "taskflow-artifacts"
      MINIO_SECURE: "False"
      JWT_SECRET: "super-secret-taskflow-jwt-key-32-chars-long!"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  scheduler:
    image: taskflow-backend:latest
    container_name: taskflow-scheduler
    restart: always
    command: python app/scheduler/monitor.py
    environment:
      POSTGRES_SERVER: "postgres"
      POSTGRES_PORT: 5432
      POSTGRES_USER: "taskflow"
      POSTGRES_PASSWORD: "taskflow_password"
      POSTGRES_DB: "taskflow_db"
      REDIS_HOST: "redis"
      REDIS_PORT: 6379
    depends_on:
      backend:
        condition: service_started

  worker-1:
    image: taskflow-backend:latest
    container_name: taskflow-worker-1
    restart: always
    command: python app/workers/daemon.py --worker-id worker-node-1 --capabilities generic,python_task,ml_prediction,data_processing
    environment:
      POSTGRES_SERVER: "postgres"
      POSTGRES_PORT: 5432
      POSTGRES_USER: "taskflow"
      POSTGRES_PASSWORD: "taskflow_password"
      POSTGRES_DB: "taskflow_db"
      REDIS_HOST: "redis"
      REDIS_PORT: 6379
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minioadminpassword"
      MINIO_BUCKET_NAME: "taskflow-artifacts"
      MINIO_SECURE: "False"
    depends_on:
      backend:
        condition: service_started

  worker-2:
    image: taskflow-backend:latest
    container_name: taskflow-worker-2
    restart: always
    command: python app/workers/daemon.py --worker-id worker-node-2 --capabilities generic,python_task,ml_prediction
    environment:
      POSTGRES_SERVER: "postgres"
      POSTGRES_PORT: 5432
      POSTGRES_USER: "taskflow"
      POSTGRES_PASSWORD: "taskflow_password"
      POSTGRES_DB: "taskflow_db"
      REDIS_HOST: "redis"
      REDIS_PORT: 6379
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minioadminpassword"
      MINIO_BUCKET_NAME: "taskflow-artifacts"
      MINIO_SECURE: "False"
    depends_on:
      backend:
        condition: service_started

  worker-3:
    image: taskflow-backend:latest
    container_name: taskflow-worker-3
    restart: always
    command: python app/workers/daemon.py --worker-id worker-node-3 --capabilities generic,data_processing
    environment:
      POSTGRES_SERVER: "postgres"
      POSTGRES_PORT: 5432
      POSTGRES_USER: "taskflow"
      POSTGRES_PASSWORD: "taskflow_password"
      POSTGRES_DB: "taskflow_db"
      REDIS_HOST: "redis"
      REDIS_PORT: 6379
    depends_on:
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taskflow-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: taskflow-prometheus
    restart: always
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

volumes:
  postgres_data:
  redis_data:
  minio_data:
