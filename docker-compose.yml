version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: taskflow-postgres
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow_password
      POSTGRES_DB: taskflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: taskflow-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-03-03T17-50-39Z
    container_name: taskflow-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  createbuckets:
    image: minio/mc:RELEASE.2024-03-03T21-36-29Z
    container_name: taskflow-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/taskflow-artifacts;
      /usr/bin/mc anonymous set public myminio/taskflow-artifacts;
      exit 0;
      "

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskflow-api
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=taskflow
      - POSTGRES_PASSWORD=taskflow_password
      - POSTGRES_DB=taskflow_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker-1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskflow-worker-1
    command: python -m app.workers.daemon worker-node-1
    environment:
      - WORKER_ID=worker-node-1
      - WORKER_CAPABILITIES=GENERIC,PYTHON_TASK,ML_PREDICTION,DATA_PROCESSING
      - POSTGRES_SERVER=postgres
      - REDIS_HOST=redis
      - MINIO_ENDPOINT=minio:9000
    depends_on:
      - api

  worker-2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskflow-worker-2
    command: python -m app.workers.daemon worker-node-2
    environment:
      - WORKER_ID=worker-node-2
      - WORKER_CAPABILITIES=GENERIC,PYTHON_TASK,ML_PREDICTION,DATA_PROCESSING
      - POSTGRES_SERVER=postgres
      - REDIS_HOST=redis
      - MINIO_ENDPOINT=minio:9000
    depends_on:
      - api

  worker-3:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskflow-worker-3
    command: python -m app.workers.daemon worker-node-3
    environment:
      - WORKER_ID=worker-node-3
      - WORKER_CAPABILITIES=GENERIC,PYTHON_TASK,ML_PREDICTION,DATA_PROCESSING
      - POSTGRES_SERVER=postgres
      - REDIS_HOST=redis
      - MINIO_ENDPOINT=minio:9000
    depends_on:
      - api

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskflow-scheduler
    command: python -m app.scheduler.monitor
    environment:
      - POSTGRES_SERVER=postgres
      - REDIS_HOST=redis
    depends_on:
      - api

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taskflow-frontend
    ports:
      - "3000:80"
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: taskflow-prometheus
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  minio_data:
